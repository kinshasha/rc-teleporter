<div class="scanner-shell">
    <ng-container [ngSwitch]="model">
        <rc-scanner-bcd386t *ngSwitchCase="'bcd386t'"></rc-scanner-bcd386t>
        <rc-scanner-bcd436hp *ngSwitchCase="'bcd436hp'"></rc-scanner-bcd436hp>
        <rc-scanner-unknown *ngSwitchDefault></rc-scanner-unknown>
    </ng-container>
</div>

<button class="wake-lock-toggle" type="button" [class.is-active]="screenWakeLockActive"
    [class.is-unavailable]="screenWakeLockStatus === 'unavailable'"
    (click)="toggleScreenWakeLock()">
    {{ screenWakeLockStatus === 'unavailable' ? 'Screen lock unavailable' : screenWakeLockActive ? 'Screen: on' : 'Screen: off' }}
</button>

<div class="audio-drawer" [class.is-open]="audioPanelOpen">
    <button class="audio-drawer__toggle" type="button" [class.is-open]="audioPanelOpen"
        [attr.aria-label]="audioPanelOpen ? 'Close audio settings' : 'Audio settings'" [attr.aria-expanded]="audioPanelOpen"
        (click)="toggleAudioPanel()">
        <span *ngIf="!audioPanelOpen" class="audio-drawer__toggle-icon" aria-hidden="true">⚙</span>
        <span *ngIf="audioPanelOpen" class="audio-drawer__toggle-close" aria-hidden="true">Close ×</span>
    </button>

    <div class="audio-drawer__panel" *ngIf="audioPanelOpen">
        <label class="audio-drawer__label" for="audio-device">
            <span class="audio-drawer__title">Mac input</span>
            <span class="audio-drawer__subtitle">Pick the interface that feeds scanner audio</span>
        </label>

        <div class="audio-drawer__controls">
            <div class="audio-device-list" role="listbox" aria-label="Mac audio inputs">
                <button class="audio-device" type="button" [class.is-selected]="audioDeviceId === -1"
                    (click)="selectAudioDevice(-1)">
                    <span>Default input</span>
                    <span class="audio-device__meta">Mac default</span>
                </button>
                <button *ngFor="let device of audioDevices" class="audio-device" type="button"
                    [class.is-selected]="audioDeviceId === device.id" (click)="selectAudioDevice(device.id)">
                    <span>{{ device.name }}</span>
                    <span class="audio-device__meta">{{ device.hostAPIName }} · {{ device.maxInputChannels }} input</span>
                </button>
            </div>

            <button class="audio-drawer__button" type="button" (click)="enableAudioPlayback()">Enable iPhone playback</button>
            <button class="audio-drawer__button" type="button" (click)="playAudioTestTone()">Test iPhone speaker</button>
            <button class="audio-drawer__button" type="button" (click)="refreshAudioDevices()">Refresh</button>
        </div>

        <div class="audio-drawer__status">{{ audioStatus }}</div>
    </div>
</div>
